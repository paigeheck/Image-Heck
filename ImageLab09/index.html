<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Camera and light -->
      <a-entity camera look-controls position="0 1.6 4"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 4 4"></a-entity>

      <!-- Environment -->
      <a-sky color="#87CEEB"></a-sky> 

      <!-- Snowman -->
      <a-sphere position="0 0.75 -5" radius="0.5" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 1.5 -5" radius="0.35" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 2.1 -5" radius="0.25" color="#FFFFFF"></a-sphere>

      <a-sphere position="0 1.5 -4.9" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="0 1.35 -4.9" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="0 1.2 -4.9" radius="0.05" color="#000000"></a-sphere>
    </a-scene>
  </body>
</html>
